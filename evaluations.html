<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تقييم الطالب</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e3f2fd;
        }

        header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }

        h2 {
            color: #1976d2;
        }

        .rating {
            display: flex;
            direction: ltr;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }

        .star {
            font-size: 40px;
            cursor: pointer;
            color: #ccc;
        }

        .star.active {
            color: #ffc107;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            height: 130px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: #2196f3;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: #2196f3;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin: 25px;
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>


<header>

    <h1>⭐ تقييم الحصة</h1>

    <p>رأيك يساعدنا على تحسين الدروس</p>

</header>


<div class="container">


    <div class="card">

        <h2>📚 تقييم الحصة</h2>

        <p>
            كيف كانت الحصة اليوم؟
        </p>

        <div class="rating" id="rating">

            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>

        </div>


        <h2>💬 ملاحظاتك</h2>

        <textarea
            id="notes"
            placeholder="اكتب رأيك أو ملاحظتك هنا..."
        ></textarea>


        <button onclick="saveEvaluation()">
            📤 إرسال التقييم
        </button>


        <div id="result"></div>

    </div>


    <a href="student.html" class="back">
        ⬅️ العودة إلى لوحة الطالب
    </a>


</div>


<script>

    let selectedRating = 0;

    let stars =
        document.querySelectorAll(".star");


    stars.forEach(function(star) {

        star.addEventListener("click", function() {

            selectedRating =
                Number(this.dataset.value);


            stars.forEach(function(item) {

                let value =
                    Number(item.dataset.value);

                if (value <= selectedRating) {

                    item.classList.add("active");

                } else {

                    item.classList.remove("active");

                }

            });

        });

    });


    function saveEvaluation() {

        let notes =
            document.getElementById("notes").value;

        let result =
            document.getElementById("result");


        if (selectedRating === 0) {

            result.innerHTML =
                "⚠️ من فضلك اختر عدد النجوم";

            result.style.color = "red";

            return;
        }


        result.innerHTML =
            "🎉 شكرًا لك! تم إرسال تقييمك " +
            selectedRating +
            " ⭐";

        result.style.color = "green";


        document.getElementById("notes").value = "";

    }

</script>


</body>

</html>
