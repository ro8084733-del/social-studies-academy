<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reham Saleh Academy - الإدارة</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #eaf7ff;
        }

        header {
            background: linear-gradient(135deg, #2196F3, #00BCD4);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 15px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            background: #2196F3;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 8px;
        }

        button:hover {
            background: #1976D2;
        }

        .reset {
            background: #00BCD4;
        }

        .logout {
            background: #e53935;
        }

        .hidden {
            display: none;
        }

        #loginMessage,
        #message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            line-height: 1.7;
        }

        #status {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #2196F3;
            color: white;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .expired {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>👩‍💼 Reham Saleh Academy</h1>
    <p>لوحة إدارة الأكاديمية</p>
</header>

<div class="container">

    <div id="status">
        ⏳ جاري تشغيل الصفحة...
    </div>

    <!-- تسجيل الدخول -->

    <div class="box" id="loginBox">

        <h2>🔐 دخول المديرة</h2>

        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
            value="ro8084733@gmail.com">

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور">

        <button type="button" id="loginButton">
            🔑 تسجيل الدخول
        </button>

        <button type="button" id="resetPasswordButton" class="reset">
            🔑 نسيت كلمة المرور؟
        </button>

        <div id="loginMessage"></div>

    </div>


    <!-- لوحة المديرة -->

    <div id="adminPanel" class="hidden">

        <div class="box">

            <h2>🎉 أهلاً بكِ في لوحة الإدارة</h2>

            <p>
                تم تسجيل دخول المديرة بنجاح.
            </p>

            <button type="button" id="logoutButton" class="logout">
                🚪 تسجيل الخروج
            </button>

        </div>


        <!-- إضافة طالب -->

        <div class="box">

            <h2>➕ إضافة طالب</h2>

            <input
                type="text"
                id="studentName"
                placeholder="اسم الطالب">

            <input
                type="text"
                id="studentGrade"
                placeholder="الصف الدراسي">

            <input
                type="text"
                id="studentPhone"
                placeholder="رقم الهاتف">

            <select id="subscription">

                <option value="">
                    اختر حالة الاشتراك
                </option>

                <option value="نشط">
                    نشط
                </option>

                <option value="منتهي">
                    منتهي
                </option>

            </select>

            <button type="button" id="addStudentButton">
                ✅ إضافة الطالب
            </button>

            <div id="message"></div>

        </div>


        <!-- قائمة الطلاب -->

        <div class="box">

            <h2>📋 الطلاب المسجلون</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>الاسم</th>
                            <th>الصف</th>
                            <th>الهاتف</th>
                            <th>البريد</th>
                            <th>الاشتراك</th>
                        </tr>

                    </thead>

                    <tbody id="studentsTable"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script type="module">

    // =========================================
    // Firebase
    // =========================================

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        sendPasswordResetEmail
    }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        serverTimestamp,
        doc,
        getDoc
    }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================================
    // إعدادات مشروع Firebase
    // =========================================

    const firebaseConfig = {

        apiKey: "AIzaSyBugR7d0M5ClUO5qEmknTzotEvrJG6FOY",

        authDomain: "rehamacasemy.firebaseapp.com",

        projectId: "rehamacasemy",

        storageBucket: "rehamacasemy.firebasestorage.app",

        messagingSenderId: "494526906082",

        appId: "1:494526906082:web:be92e4553824676b17e8bb",

        measurementId: "G-K43J55JD61"
    };


    // =========================================
    // تشغيل Firebase
    // =========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // =========================================
    // اختبار Firebase
    // =========================================

    document.getElementById("status").textContent =
        "✅ Firebase يعمل";


    const loginBox =
        document.getElementById("loginBox");

    const adminPanel =
        document.getElementById("adminPanel");

    const loginMessage =
        document.getElementById("loginMessage");


    // =========================================
    // تسجيل دخول المديرة
    // =========================================

    document
        .getElementById("loginButton")
        .addEventListener("click", async function () {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            if (email === "" || password === "") {

                loginMessage.textContent =
                    "⚠️ اكتبي البريد وكلمة المرور";

                loginMessage.style.color = "red";

                return;
            }


            loginMessage.textContent =
                "⏳ جاري تسجيل الدخول...";

            loginMessage.style.color = "#2196F3";


            try {

                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                // التأكد من أن الحساب حساب مديرة

                const adminRef =
                    doc(
                        db,
                        "admins",
                        result.user.uid
                    );


                const adminDoc =
                    await getDoc(adminRef);


                if (!adminDoc.exists()) {

                    loginMessage.textContent =
                        "❌ هذا الحساب ليس حساب مديرة";

                    loginMessage.style.color = "red";

                    await signOut(auth);

                    return;
                }


                loginMessage.textContent =
                    "✅ تم تسجيل الدخول بنجاح";

                loginMessage.style.color = "green";


                loginBox.classList.add("hidden");

                adminPanel.classList.remove("hidden");


                loadStudents();

            }

            catch (error) {

                console.log(error);

                loginMessage.style.color = "red";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    loginMessage.textContent =
                        "❌ البريد أو كلمة المرور غير صحيحة";

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    loginMessage.textContent =
                        "⚠️ تم إجراء محاولات كثيرة، حاولي مرة أخرى لاحقًا";

                }

                else {

                    loginMessage.textContent =
                        "❌ حدث خطأ في تسجيل الدخول";

                }

            }

        });


    // =========================================
    // نسيت كلمة المرور
    // =========================================

    document
        .getElementById("resetPasswordButton")
        .addEventListener("click", async function () {

            const email =
                document.getElementById("email").value.trim();


            if (email === "") {

                loginMessage.textContent =
                    "⚠️ اكتبي البريد الإلكتروني أولاً";

                loginMessage.style.color = "red";

                return;
            }


            loginMessage.textContent =
                "⏳ جاري إرسال رسالة إعادة تعيين كلمة المرور...";

            loginMessage.style.color = "#2196F3";


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                loginMessage.textContent =
                    "📩 تم إرسال رسالة إعادة تعيين كلمة المرور. افحصي البريد الوارد وSpam.";

                loginMessage.style.color = "green";

            }

            catch (error) {

                console.log(error);

                loginMessage.style.color = "red";


                if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    loginMessage.textContent =
                        "❌ البريد الإلكتروني غير صحيح";

                }

                else {

                    loginMessage.textContent =
                        "❌ لم يتم إرسال الرسالة";

                }

            }

        });


    // =========================================
    // تحميل الطلاب
    // =========================================

    async function loadStudents() {

        const table =
            document.getElementById("studentsTable");


        table.innerHTML = "";


        try {

            const snapshot =
                await getDocs(
                    collection(db, "students")
                );


            if (snapshot.empty) {

                table.innerHTML =
                    `<tr>
                        <td colspan="5">
                            لا يوجد طلاب حتى الآن
                        </td>
                    </tr>`;

                return;
            }


            snapshot.forEach(function (item) {

                const student =
                    item.data();


                const row =
                    table.insertRow();


                row.insertCell(0).textContent =
                    student.name || "—";

                row.insertCell(1).textContent =
                    student.grade || "—";

                row.insertCell(2).textContent =
                    student.phone || "—";

                row.insertCell(3).textContent =
                    student.email || "—";


                const status =
                    student.subscription || "نشط";


                const cell =
                    row.insertCell(4);


                cell.textContent =
                    status;


                if (status === "نشط") {

                    cell.className = "active";

                }

                else {

                    cell.className = "expired";

                }

            });

        }

        catch (error) {

            console.log(error);

            table.innerHTML =
                `<tr>
                    <td colspan="5">
                        ❌ حدث خطأ في تحميل الطلاب
                    </td>
                </tr>`;

        }

    }


    // =========================================
    // إضافة طالب
    // =========================================

    document
        .getElementById("addStudentButton")
        .addEventListener("click", async function () {

            const name =
                document.getElementById("studentName").value.trim();

            const grade =
                document.getElementById("studentGrade").value.trim();

            const phone =
                document.getElementById("studentPhone").value.trim();

            const subscription =
                document.getElementById("subscription").value;


            const message =
                document.getElementById("message");


            if (
                name === "" ||
                grade === "" ||
                phone === "" ||
                subscription === ""
            ) {

                message.textContent =
                    "⚠️ املئي جميع البيانات";

                message.style.color = "red";

                return;
            }


            try {

                await addDoc(
                    collection(db, "students"),
                    {
                        name: name,
                        grade: grade,
                        phone: phone,
                        subscription: subscription,
                        createdAt: serverTimestamp()
                    }
                );


                message.textContent =
                    "🎉 تم إضافة الطالب";

                message.style.color = "green";


                document.getElementById("studentName").value = "";

                document.getElementById("studentGrade").value = "";

                document.getElementById("studentPhone").value = "";

                document.getElementById("subscription").value = "";


                loadStudents();

            }

            catch (error) {

                console.log(error);

                message.textContent =
                    "❌ لم يتم إضافة الطالب";

                message.style.color = "red";

            }

        });


    // =========================================
    // تسجيل الخروج
    // =========================================

    document
        .getElementById("logoutButton")
        .addEventListener("click", async function () {

            await signOut(auth);

            window.location.reload();

        });

</script>

</body>

</html>
