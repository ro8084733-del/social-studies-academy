<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل دخول الطالب - Reham Saleh Academy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf7ff;
            margin: 0;
        }

        header {
            background: linear-gradient(135deg, #2196F3, #00BCD4);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2196F3;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }

        button:disabled {
            background: #90caf9;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .newstudent {
            text-align: center;
            margin-top: 20px;
        }

        .newstudent a {
            color: #2196F3;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

<header>

    <h1>🎓 Reham Saleh Academy</h1>

    <p>تسجيل دخول الطالب</p>

</header>


<div class="box">

    <h2>🔐 أهلاً بك</h2>


    <label for="email">
        البريد الإلكتروني
    </label>

    <input
        type="email"
        id="email"
        placeholder="example@gmail.com"
    >


    <label for="password">
        كلمة المرور
    </label>

    <input
        type="password"
        id="password"
        placeholder="اكتب كلمة المرور"
    >


    <button id="loginBtn">

        🚀 تسجيل الدخول

    </button>


    <div id="message"></div>


    <div class="newstudent">

        ليس لديك حساب؟

        <a href="newstudent.html">
            📝 إنشاء حساب جديد
        </a>

    </div>

</div>


<script type="module">

    import { auth } from "./firebase-config.js";

    import {
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const loginBtn =
        document.getElementById("loginBtn");

    const message =
        document.getElementById("message");


    loginBtn.addEventListener("click", async function () {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        // التأكد من البيانات

        if (email === "" || password === "") {

            message.textContent =
                "⚠️ من فضلك اكتب البريد الإلكتروني وكلمة المرور";

            message.style.color = "red";

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "⏳ جاري تسجيل الدخول...";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            message.textContent =
                "🎉 تم تسجيل الدخول بنجاح!";

            message.style.color = "green";


            setTimeout(function () {

                window.location.href =
                    "student.html";

            }, 1000);


        } catch (error) {

            console.log(error);


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.textContent =
                    "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message.textContent =
                    "❌ لا يوجد حساب بهذا البريد الإلكتروني";

            }

            else {

                message.textContent =
                    "❌ حدث خطأ أثناء تسجيل الدخول";

            }


            message.style.color = "red";

            loginBtn.disabled = false;

            loginBtn.textContent =
                "🚀 تسجيل الدخول";

        }

    });

</script>


</body>

</html>
