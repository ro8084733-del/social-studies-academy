<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل دخول الطالب</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf7ff;
            margin: 0;
        }

        header {
            background: linear-gradient(135deg, #2196F3, #00BCD4);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 450px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2196F3;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #2196F3;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎓 أكاديمية الدراسات الاجتماعية</h1>
        <p>تسجيل دخول الطالب</p>
    </header>

    <div class="box">

        <h2>🔐 أهلاً بك</h2>

        <label for="username">اسم المستخدم</label>

        <input
            type="text"
            id="username"
            placeholder="اكتب اسم المستخدم"
        >

        <label for="password">كلمة المرور</label>

        <input
            type="password"
            id="password"
            placeholder="اكتب كلمة المرور"
        >

        <button onclick="loginStudent()">
            🚀 تسجيل الدخول
        </button>

        <div id="message"></div>

        <div class="newstudent">
            ليس لديك حساب؟
            <a href="newstudent.html">📝 إنشاء حساب جديد</a>
        </div>

    </div>


    <script>

        function loginStudent() {

            // الحصول على البيانات التي كتبها الطالب
            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value;

            // مكان ظهور الرسالة
            let message = document.getElementById("message");


            // التأكد أن البيانات ليست فارغة
            if (username === "" || password === "") {

                message.textContent =
                    "⚠️ من فضلك اكتب اسم المستخدم وكلمة المرور";

                message.style.color = "red";

                return;
            }


            // الحصول على بيانات الحساب الذي تم إنشاؤه
            let savedUsername =
                localStorage.getItem("studentUsername");

            let savedPassword =
                localStorage.getItem("studentPassword");


            // التأكد أن هناك حساباً مسجلاً
            if (savedUsername === null || savedPassword === null) {

                message.textContent =
                    "⚠️ لا يوجد حساب مسجل. قم بإنشاء حساب أولاً.";

                message.style.color = "red";

                return;
            }


            // مقارنة البيانات
            if (
                username === savedUsername &&
                password === savedPassword
            ) {

                message.textContent =
                    "🎉 تم تسجيل الدخول بنجاح!";

                message.style.color = "green";


                // الانتقال إلى صفحة الطالب
                setTimeout(function () {

                    window.location.href = "student.html";

                }, 1000);


            } else {

                message.textContent =
                    "❌ اسم المستخدم أو كلمة المرور غير صحيحة";

                message.style.color = "red";
            }

        }

    </script>

</body>

</html>
