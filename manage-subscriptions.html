<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة الاشتراكات</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #eaf7ff;
        }

        header {
            background: linear-gradient(135deg, #2196F3, #00BCD4);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 15px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 8px;
        }

        button:hover {
            background: #1976D2;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #2196F3;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5fbff;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .expired {
            color: red;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin: 25px 0;
        }

        .back button {
            background: #555;
        }

    </style>

</head>

<body>

<header>

    <h1>💳 إدارة الاشتراكات</h1>

    <p>لوحة المعلم</p>

</header>


<div class="container">


    <!-- إضافة اشتراك -->

    <div class="box">

        <h2>➕ إضافة اشتراك</h2>

        <input
            type="text"
            id="studentName"
            placeholder="اسم الطالب">

        <input
            type="number"
            id="amount"
            placeholder="قيمة الاشتراك بالجنيه">

        <input
            type="date"
            id="startDate">

        <input
            type="date"
            id="nextPayment">

        <input
            type="number"
            id="classes"
            placeholder="عدد الحصص">

        <button onclick="addSubscription()">
            ✅ حفظ الاشتراك
        </button>

        <div id="message"></div>

    </div>


    <!-- الاشتراكات -->

    <div class="box">

        <h2>📋 اشتراكات الطلاب</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>الطالب</th>
                        <th>قيمة الاشتراك</th>
                        <th>بداية الاشتراك</th>
                        <th>الدفع القادم</th>
                        <th>الحصص المتبقية</th>
                        <th>الحالة</th>
                    </tr>

                </thead>

                <tbody id="subscriptionsTable">

                    <tr>

                        <td>محمد أحمد</td>

                        <td>500 جنيه</td>

                        <td>01/09/2026</td>

                        <td>01/10/2026</td>

                        <td>8</td>

                        <td class="active">
                            ✅ نشط
                        </td>

                    </tr>

                    <tr>

                        <td>سارة علي</td>

                        <td>500 جنيه</td>

                        <td>01/09/2026</td>

                        <td>01/10/2026</td>

                        <td>6</td>

                        <td class="active">
                            ✅ نشط
                        </td>

                    </tr>

                    <tr>

                        <td>أحمد محمود</td>

                        <td>500 جنيه</td>

                        <td>01/08/2026</td>

                        <td>01/09/2026</td>

                        <td>0</td>

                        <td class="expired">
                            ❌ منتهي
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <div class="back">

        <button onclick="window.location.href='admin.html'">
            ↩️ العودة للوحة المعلم
        </button>

    </div>

</div>


<script>

function addSubscription() {

    let name =
        document.getElementById("studentName").value.trim();

    let amount =
        document.getElementById("amount").value;

    let startDate =
        document.getElementById("startDate").value;

    let nextPayment =
        document.getElementById("nextPayment").value;

    let classes =
        document.getElementById("classes").value;

    let message =
        document.getElementById("message");


    if (
        name === "" ||
        amount === "" ||
        startDate === "" ||
        nextPayment === "" ||
        classes === ""
    ) {

        message.textContent =
            "⚠️ من فضلك املأ جميع البيانات";

        message.style.color = "red";

        return;

    }


    let table =
        document.getElementById("subscriptionsTable");

    let row =
        table.insertRow();


    row.insertCell(0).textContent = name;

    row.insertCell(1).textContent =
        amount + " جنيه";

    row.insertCell(2).textContent =
        startDate;

    row.insertCell(3).textContent =
        nextPayment;

    row.insertCell(4).textContent =
        classes;


    let status =
        row.insertCell(5);

    if (Number(classes) > 0) {

        status.textContent = "✅ نشط";
        status.className = "active";

    } else {

        status.textContent = "❌ منتهي";
        status.className = "expired";

    }


    message.textContent =
        "🎉 تم حفظ الاشتراك بنجاح";

    message.style.color = "green";


    document.getElementById("studentName").value = "";

    document.getElementById("amount").value = "";

    document.getElementById("startDate").value = "";

    document.getElementById("nextPayment").value = "";

    document.getElementById("classes").value = "";

}

</script>

</body>

</html>
