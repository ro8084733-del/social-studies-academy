<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الأطفال</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #dff5ff;
        margin: 0;
        padding: 20px;
    }
    .box {
        max-width: 700px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        text-align: center;
    }
    h1 { color: #2196F3; }
    input[type="text"] {
        width: 90%;
        padding: 14px;
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 10px;
        margin: 15px 0;
        text-align: right;
    }
    .answer {
        display: block;
        background: #f1f8ff;
        margin: 12px 0;
        padding: 14px;
        border-radius: 10px;
        cursor: pointer;
        text-align: right;
        font-size: 18px;
    }
    .answer:hover { background: #e0f2ff; }
    button {
        background: #2196F3;
        color: white;
        border: none;
        padding: 14px 30px;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 15px;
    }
    button:hover { background: #1976D2; }
    .hidden { display: none; }
    #result { font-size: 22px; }
</style>
</head>

<body>

<div class="box">

    <!-- صفحة الاسم -->
    <div id="page1">
        <h1>🎓 اختبار الأطفال</h1>
        <p>اكتب اسمك أولاً</p>
        <input type="text" id="studentName" placeholder="اسم الطالب">
        <br>
        <button onclick="startQuiz()">ابدأ الاختبار</button>
    </div>

    <!-- صفحة الأسئلة -->
    <div id="quizPage" class="hidden">
        <h1>📝 الاختبار</h1>
        <h2 id="questionNumber"></h2>
        <p id="questionText"></p>
        <div id="answers"></div>
        <button onclick="nextQuestion()">التالي</button>
    </div>

    <!-- صفحة النتيجة -->
    <div id="result" class="hidden">
        <h1 id="finalMessage"></h1>
        <p id="finalScore"></p>
        <button onclick="location.reload()">إعادة الاختبار</button>
    </div>

</div>

<script>
const questions = [
    {
        question: "ما اللغة المستخدمة لإنشاء هيكل صفحة الويب؟",
        answers: ["HTML", "CSS", "JavaScript", "Excel"],
        correct: 0
    },
    {
        question: "ما اللغة المستخدمة لتنسيق وتصميم صفحة الويب؟",
        answers: ["HTML", "CSS", "Python", "Word"],
        correct: 1
    },
    {
        question: "ما اللغة التي تضيف التفاعل والحركة إلى صفحة الويب؟",
        answers: ["HTML", "CSS", "JavaScript", "PowerPoint"],
        correct: 2
    },
    {
        question: "ماذا تسمى الأقواس < > في HTML؟",
        answers: ["Tags", "Buttons", "Images", "Tables"],
        correct: 0
    }
];

let currentQuestion = 0;
let score = 0;
let studentName = "";

function startQuiz() {
    studentName = document.getElementById("studentName").value.trim();

    if (studentName === "") {
        alert("من فضلك اكتب اسم الطالب أولاً");
        return;
    }

    document.getElementById("page1").classList.add("hidden");
    document.getElementById("quizPage").classList.remove("hidden");

    showQuestion();
}

function showQuestion() {
    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "السؤال " + (currentQuestion + 1) + " من " + questions.length;

    document.getElementById("questionText").textContent = q.question;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        answersDiv.innerHTML += `
            <label class="answer">
                <input type="radio" name="answer" value="${index}">
                ${answer}
            </label>
        `;
    });
}

function nextQuestion() {
    const selected = document.querySelector('input[name="answer"]:checked');

    if (!selected) {
        alert("من فضلك اختر إجابة أولاً");
        return;
    }

    if (Number(selected.value) === questions[currentQuestion].correct) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quizPage").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("finalMessage").textContent =
        "🎉 أحسنت يا " + studentName;

    document.getElementById("finalScore").textContent =
        "⭐ درجتك " + score + " من " + questions.length;
}
</script>

</body>
</html>
