<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب جديد - Reham Saleh Academy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf7ff;
            margin: 0;
        }

        header {
            background: linear-gradient(135deg, #2196F3, #00BCD4);
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2196F3;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #2196F3;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Reham Saleh Academy</h1>
    <p>إنشاء حساب طالب جديد</p>
</header>

<div class="box">

    <h2>📝 إنشاء حساب جديد</h2>

    <label for="name">اسم الطالب</label>
    <input type="text" id="name" placeholder="اكتب اسم الطالب">

    <label for="grade">الصف الدراسي</label>
    <input type="text" id="grade" placeholder="مثال: الصف السادس">

    <label for="phone">رقم الهاتف</label>
    <input type="text" id="phone" placeholder="اكتب رقم الهاتف">

    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@gmail.com">

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" placeholder="اكتب كلمة المرور">

    <label for="confirmPassword">تأكيد كلمة المرور</label>
    <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور">

    <button id="createBtn">
        ✅ إنشاء الحساب
    </button>

    <div id="message"></div>

    <div class="login">
        لديك حساب بالفعل؟
        <a href="login.html">🔐 تسجيل الدخول</a>
    </div>

</div>


<script type="module">

    import { auth, db } from "./firebase-config.js";

    import {
        createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const createBtn = document.getElementById("createBtn");
    const message = document.getElementById("message");


    createBtn.addEventListener("click", async function () {

        const name =
            document.getElementById("name").value.trim();

        const grade =
            document.getElementById("grade").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        // التأكد من البيانات

        if (
            name === "" ||
            grade === "" ||
            phone === "" ||
            email === "" ||
            password === "" ||
            confirmPassword === ""
        ) {

            message.textContent =
                "⚠️ من فضلك املأ جميع البيانات";

            message.style.color = "red";

            return;
        }


        // التأكد من تطابق كلمة المرور

        if (password !== confirmPassword) {

            message.textContent =
                "❌ كلمتا المرور غير متطابقتين";

            message.style.color = "red";

            return;
        }


        // إنشاء الحساب في Firebase

        createBtn.disabled = true;
        createBtn.textContent = "⏳ جاري إنشاء الحساب...";


        try {

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user = userCredential.user;


            // حفظ بيانات الطالب في Firestore

            await setDoc(
                doc(db, "students", user.uid),
                {
                    name: name,
                    grade: grade,
                    phone: phone,
                    email: email,
                    uid: user.uid,
                    createdAt: serverTimestamp()
                }
            );


            message.textContent =
                "🎉 تم إنشاء الحساب بنجاح!";

            message.style.color = "green";


            setTimeout(function () {

                window.location.href = "login.html";

            }, 1500);


        } catch (error) {

            console.log(error);


            if (error.code === "auth/email-already-in-use") {

                message.textContent =
                    "❌ هذا البريد الإلكتروني مسجل بالفعل";

            }

            else if (error.code === "auth/weak-password") {

                message.textContent =
                    "❌ كلمة المرور يجب أن تكون أقوى";

            }

            else if (error.code === "auth/invalid-email") {

                message.textContent =
                    "❌ البريد الإلكتروني غير صحيح";

            }

            else {

                message.textContent =
                    "❌ حدث خطأ أثناء إنشاء الحساب";

            }

            message.style.color = "red";

            createBtn.disabled = false;
            createBtn.textContent = "✅ إنشاء الحساب";

        }

    });

</script>

</body>
</html>
