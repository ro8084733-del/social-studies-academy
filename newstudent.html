<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب جديد</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eaf7ff;
            margin: 0;
        }

        header {
            background: linear-gradient(135deg, #2196F3, #00BCD4);
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2196F3;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1976D2;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #2196F3;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <h1>🎓 أكاديمية الدراسات الاجتماعية</h1>

    <p>إنشاء حساب طالب جديد</p>

</header>


<div class="box">

    <h2>📝 إنشاء حساب جديد</h2>


    <label for="name">اسم الطالب</label>

    <input
        type="text"
        id="name"
        placeholder="اكتب اسم الطالب"
    >


    <label for="grade">الصف الدراسي</label>

    <input
        type="text"
        id="grade"
        placeholder="مثال: الصف السادس"
    >


    <label for="phone">رقم الهاتف</label>

    <input
        type="text"
        id="phone"
        placeholder="اكتب رقم الهاتف"
    >


    <label for="username">اسم المستخدم</label>

    <input
        type="text"
        id="username"
        placeholder="اختار اسم مستخدم"
    >


    <label for="password">كلمة المرور</label>

    <input
        type="password"
        id="password"
        placeholder="اكتب كلمة المرور"
    >


    <label for="confirmPassword">تأكيد كلمة المرور</label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="أعد كتابة كلمة المرور"
    >


    <button onclick="createAccount()">
        ✅ إنشاء الحساب
    </button>


    <div id="message"></div>


    <div class="login">

        لديك حساب بالفعل؟

        <a href="login.html">
            🔐 تسجيل الدخول
        </a>

    </div>

</div>


<script>

function createAccount() {

    let name =
        document.getElementById("name").value.trim();

    let grade =
        document.getElementById("grade").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let username =
        document.getElementById("username").value.trim();

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;

    let message =
        document.getElementById("message");


    // التأكد من ملء جميع البيانات

    if (
        name === "" ||
        grade === "" ||
        phone === "" ||
        username === "" ||
        password === "" ||
        confirmPassword === ""
    ) {

        message.textContent =
            "⚠️ من فضلك املأ جميع البيانات";

        message.style.color = "red";

        return;
    }


    // التأكد من تطابق كلمة المرور

    if (password !== confirmPassword) {

        message.textContent =
            "❌ كلمتا المرور غير متطابقتين";

        message.style.color = "red";

        return;
    }


    // حفظ بيانات الطالب

    localStorage.setItem(
        "studentName",
        name
    );

    localStorage.setItem(
        "studentGrade",
        grade
    );

    localStorage.setItem(
        "studentPhone",
        phone
    );

    localStorage.setItem(
        "studentUsername",
        username
    );

    localStorage.setItem(
        "studentPassword",
        password
    );


    // رسالة النجاح

    message.textContent =
        "🎉 تم إنشاء الحساب بنجاح!";

    message.style.color = "green";


    // الانتقال إلى تسجيل الدخول

    setTimeout(function() {

        window.location.href = "login.html";

    }, 1000);

}

</script>


</body>

</html>

بعد إنشاء الملف

في "index.html" غيّري الرابطين الخاصين بإنشاء الحساب إلى:

<a href="newstudent.html">📝 إنشاء حساب</a>

وفي "login.html":

<a href="newstudent.html">📝 إنشاء حساب جديد</a>

وبكده يبقى عندنا:

index → newstudent → login → student
